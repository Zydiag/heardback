name: Bug report
description: Something heardback or jv did wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't paste transcripts, trace files or what you said to the assistant word for word: describe it instead.
        Found a way around the read-back or the allowlist? Report it privately instead (Security tab, "Report a vulnerability").
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did or said (roughly), what heardback did, and what you expected.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: A `jv ...` command is best, if the bug shows up without voice.
      placeholder: |
        1. jv tmux list
        2. ...
  - type: textarea
    id: doctor
    attributes:
      label: heardback doctor
      description: Paste the full output of `heardback doctor`.
      render: text
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install
      options:
        - jv only (no voice extra)
        - voice (GPU)
        - voice-cpu
    validations:
      required: true
  - type: input
    id: desktop
    attributes:
      label: Desktop and distro
      placeholder: e.g. Hyprland on Arch, GNOME on Fedora
  - type: textarea
    id: logs
    attributes:
      label: Errors
      description: Relevant lines from `heardback-voice trace --errors` or `journalctl --user -u heardback`, with anything personal removed.
      render: text
